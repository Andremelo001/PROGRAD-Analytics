# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# O pre-commit roda a partir da raiz do repo; `poetry -C backend` muda o
# diretório de trabalho pra backend/ antes de rodar cada ferramenta (lá estão
# pyproject.toml e o .venv). Os hooks só disparam quando algo em backend/ muda.
repos:
    - repo: local
      hooks:

          - id: black
            name: Format with Black
            entry: poetry -C backend run black
            language: system
            files: ^backend/.*\.py$
            pass_filenames: false
            args: ["app", "tests"]

          - id: ruff
            name: Check with Ruff
            entry: poetry -C backend run ruff
            language: system
            files: ^backend/.*\.py$
            pass_filenames: false
            args: ["check", "app", "tests", "--fix"]

          - id: mypy
            name: Validate types with MyPy
            entry: poetry -C backend run mypy
            language: system
            files: ^backend/.*\.py$
            pass_filenames: false
            args: ["app"]
